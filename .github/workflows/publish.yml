# Publishes to PyPI when a GitHub release is published. Uses PyPI trusted publishing (no token):
# on pypi.org -> Your account -> Publishing -> Add a pending publisher:
#   project stickerbyvin, owner PRIMITIFA, repo stickerbyvin-python, workflow publish.yml, environment pypi
name: publish
on:
  release:
    types: [published]
  workflow_dispatch:
jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python -m pip install build && python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
